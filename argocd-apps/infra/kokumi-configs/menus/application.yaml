apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice-menus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devops-homelab/k3d-gitops
    targetRevision: main
    path: argocd-apps/infra/kokumi-configs/menus
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  revisionHistoryLimit: 3
