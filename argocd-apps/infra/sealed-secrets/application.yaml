apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-operator
  namespace: argocd
spec:
  project: default
  sources:
  - helm:
      valueFiles:
        - $values/charts/infra/sealed-secrets/values.yaml
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 2.1.3
    chart: sealed-secrets
  - repoURL: https://github.com/devops-homelab/k3d-gitops
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true