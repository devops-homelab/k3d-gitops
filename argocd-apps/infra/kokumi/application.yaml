apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kokumi
  namespace: argocd
spec:
  project: default
  sources:
    # dist/install.yaml is committed at each release tag in the kokumi repo
    - repoURL: https://github.com/kokumi-dev/kokumi
      targetRevision: 0.14.0
      path: dist
    # registry-credentials Secret has namespace: argocd in metadata, so it lands in the right namespace
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: charts/infra/kokumi
  destination:
    server: https://kubernetes.default.svc
    namespace: kokumi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
  revisionHistoryLimit: 3