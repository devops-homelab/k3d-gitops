apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-order
  namespace: argocd
spec:
  project: default
  sources:
    # Kokumi Order
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: charts/microservices/podinfo
      directory:
        include: "order.yaml"
    # GHCR Pantry & credentials
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: argocd-apps/microservices/pantries
    # Cluster-scoped Menus (templates)
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: argocd-apps/microservices/menus
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
