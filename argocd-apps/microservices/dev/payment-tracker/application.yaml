apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3d-payment-tracker
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: charts/microservices/common
      helm:
        releaseName: k3d-payment-tracker
        valueFiles:
          - ../dev/payment-tracker/values.yaml
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: argocd-apps/microservices/dev/payment-tracker/resources
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3