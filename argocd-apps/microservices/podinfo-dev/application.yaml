apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-dev-order
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: charts/microservices/podinfo
      directory:
        include: "order-dev.yaml"
    - repoURL: https://github.com/devops-homelab/k3d-gitops
      targetRevision: main
      path: argocd-apps/infra/kokumi-configs/pantries
      directory:
        include: "*-dev.*"
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
