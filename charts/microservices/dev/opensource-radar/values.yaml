replicaCount: 1

image:
  repository: "navindujay/k3d-opensource-radar"
  tag: "2b3ea38f9383e98c61ad4b97c5e42e5ae21a0eda"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: opensource-radar.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /
  liveness:
    path: /

persistence:
  enabled: false

tailscaleIngress:
  enabled: true
  hostname: opensource-radar
