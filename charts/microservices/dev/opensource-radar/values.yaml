replicaCount: 1

image:
  repository: "navindujay/k3d-opensource-radar"
  tag: "6fd5ba942891e3eaf96de73b1769e6f7728d9873"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: opensource-radar.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /
  liveness:
    path: /

persistence:
  enabled: false

tailscaleIngress:
  enabled: true
  hostname: opensource-radar
