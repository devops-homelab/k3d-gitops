replicaCount: 1

image:
  repository: "navindujay/k3d-payment-tracker"
  tag: "3c0852652efffb0c4d3b0048d287c66260a4011a"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: payment-tracker.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /healthz
  liveness:
    path: /healthz

env:
  - name: DB_PATH
    value: /data/daybook.db
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: payment-tracker-api
        key: api-token
  - name: APP_USERNAME
    valueFrom:
      secretKeyRef:
        name: payment-tracker-api
        key: app-username
  - name: APP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: payment-tracker-api
        key: app-password

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data

tailscaleIngress:
  enabled: true
  hostname: payment-tracker