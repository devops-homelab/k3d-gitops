replicaCount: 1

image:
  repository: "navindujay/k3d-payment-tracker"
  tag: "2789af4efbf837b1f31df85150ff68af0116d239"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: payment-tracker.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /healthz
  liveness:
    path: /healthz