replicaCount: 1

image:
  repository: "navindujay/k3d-payment-tracker"
  tag: "e0fa01850e116a7710b10e1e56d9b6b426e73292"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: payment-tracker.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /healthz
  liveness:
    path: /healthz