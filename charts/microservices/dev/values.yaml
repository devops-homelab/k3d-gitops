replicaCount: 1

image:
  repository: navindujay/k3d-microservice
  tag: "3b7ef542fe715310c9fa5ba69d0a4c66623eabef"

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: microservice.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /health
  liveness:
    path: /health
