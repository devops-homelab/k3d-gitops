replicaCount: 1

image:
  repository: navindujay/k3d-microservice
  tag: "7bea905a94cfcdfefee0f978606e3d596bcd8819"

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: microservice.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /health
  liveness:
    path: /health
