replicaCount: 1

image:
  repository: navindujay/k3d-microservice
  tag: "bfc1f055e8b9b80788b45cff1a912cb399ac8cee"

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: microservice.localhost
      paths:
        - path: /
          pathType: Prefix

probes:
  readiness:
    path: /health
  liveness:
    path: /health
