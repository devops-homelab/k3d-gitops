apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo-qa
  namespace: microservices-qa
spec:
  menuRef:
    name: ghcr-microservice
  render:
    helm:
      releaseName: podinfo-qa
      namespace: microservices-qa
      values:
        image:
          repository: ghcr.io/stefanprodan/podinfo
          tag: "6.10.2"
        service:
          port: 9898
        env:
          - name: PODINFO_UI_MESSAGE
            value: "Hello from k3d QA"
          - name: PODINFO_UI_COLOR
            value: "#2196F3"
  destination:
    oci: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo-qa
  autoDeploy: Enabled
