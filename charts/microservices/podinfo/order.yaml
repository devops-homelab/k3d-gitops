apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo
  namespace: microservices
spec:
  source:
    pantryRef:
      name: ghcr-microservice
    version: "0.1.0"
  render:
    helm:
      releaseName: podinfo
      namespace: microservices
      valuesFrom:
        - path: charts/microservices/podinfo/values.yaml
  destination:
    oci: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo
  autoDeploy: Enabled
