apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo
  namespace: microservices
spec:
  source:
    oci: oci://ghcr.io/devops-homelab/charts/microservice
    version: "0.1.0"
  render:
    helm:
      releaseName: podinfo
      namespace: microservices
      values:
        image:
          repository: ghcr.io/stefanprodan/podinfo
          tag: "6.10.2"
        service:
          port: 9898
        env:
          - name: PODINFO_UI_MESSAGE
            value: "Hello from k3d"
          - name: PODINFO_UI_COLOR
            value: "#EF6461"
  destination:
    oci: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo
  autoDeploy: Enabled

