# Argo CD repository credentials for Kokumi's in-cluster OCI registry
# This allows Argo CD to pull manifests from Kokumi's internal registry
apiVersion: v1
kind: Secret
metadata:
  name: kokumi-manifests-registry-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: oci
  url: oci://kokumi-registry.kokumi.svc.cluster.local:5000
  # In-cluster registry uses HTTP (no TLS yet)
  insecureOCIForceHttp: "true"