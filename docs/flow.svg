<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Kokumi GitOps Flow</text>

  <!-- ── Git Repo ── -->
  <rect x="20" y="60" width="180" height="200" rx="8" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8a">Git Repo</text>

  <rect x="34" y="92" width="152" height="28" rx="4" fill="#4a90d9"/>
  <text x="110" y="111" text-anchor="middle" font-size="11" fill="white">ArgoCD Applications</text>

  <rect x="34" y="128" width="152" height="28" rx="4" fill="#4a90d9"/>
  <text x="110" y="147" text-anchor="middle" font-size="11" fill="white">Order (per env)</text>

  <rect x="34" y="164" width="152" height="28" rx="4" fill="#4a90d9"/>
  <text x="110" y="183" text-anchor="middle" font-size="11" fill="white">Menu</text>

  <rect x="34" y="200" width="152" height="28" rx="4" fill="#4a90d9"/>
  <text x="110" y="219" text-anchor="middle" font-size="11" fill="white">Pantry + SealedSecret</text>

  <!-- ── ArgoCD ── -->
  <rect x="260" y="60" width="150" height="110" rx="8" fill="#edf7ed" stroke="#4caf50" stroke-width="1.5"/>
  <text x="335" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ArgoCD</text>
  <text x="335" y="104" text-anchor="middle" font-size="11" fill="#444">Watches Git</text>
  <text x="335" y="122" text-anchor="middle" font-size="11" fill="#444">Syncs resources</text>
  <text x="335" y="140" text-anchor="middle" font-size="11" fill="#444">into cluster</text>

  <!-- Git → ArgoCD -->
  <line x1="200" y1="155" x2="258" y2="115" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── SealedSecrets ── -->
  <rect x="260" y="200" width="150" height="75" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="335" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">SealedSecrets</text>
  <text x="335" y="244" text-anchor="middle" font-size="11" fill="#444">Decrypts sealed</text>
  <text x="335" y="260" text-anchor="middle" font-size="11" fill="#444">secret → ghcr-creds</text>

  <!-- ArgoCD → SealedSecrets -->
  <line x1="335" y1="170" x2="335" y2="198" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── GHCR ── -->
  <rect x="260" y="370" width="150" height="75" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
  <text x="335" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">GHCR</text>
  <text x="335" y="414" text-anchor="middle" font-size="11" fill="#444">ghcr.io/devops-homelab</text>
  <text x="335" y="430" text-anchor="middle" font-size="11" fill="#444">/charts/microservice</text>

  <!-- ── Kokumi Controller ── -->
  <rect x="480" y="140" width="175" height="165" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="567" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Kokumi Controller</text>
  <text x="567" y="184" text-anchor="middle" font-size="11" fill="#555">Reads Order + Menu</text>
  <text x="567" y="202" text-anchor="middle" font-size="11" fill="#555">Auth via Pantry</text>
  <text x="567" y="220" text-anchor="middle" font-size="11" fill="#555">Pulls chart from GHCR</text>
  <text x="567" y="238" text-anchor="middle" font-size="11" fill="#555">Renders with Helm</text>
  <text x="567" y="256" text-anchor="middle" font-size="11" fill="#555">Creates Preparation</text>
  <text x="567" y="274" text-anchor="middle" font-size="11" fill="#555">Creates Serving</text>
  <text x="567" y="292" text-anchor="middle" font-size="11" fill="#9c27b0">↓ ArgoCD Application</text>

  <!-- ArgoCD → Kokumi (deploys Order/Menu/Pantry) -->
  <line x1="410" y1="115" x2="478" y2="190" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SealedSecrets → Kokumi (creds) -->
  <line x1="410" y1="237" x2="478" y2="237" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GHCR → Kokumi -->
  <line x1="410" y1="400" x2="478" y2="280" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- ── In-cluster OCI Registry ── -->
  <rect x="480" y="370" width="175" height="75" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="567" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">In-cluster Registry</text>
  <text x="567" y="414" text-anchor="middle" font-size="11" fill="#444">Stores immutable</text>
  <text x="567" y="430" text-anchor="middle" font-size="11" fill="#444">Preparations (OCI)</text>

  <!-- Kokumi → Registry -->
  <line x1="567" y1="305" x2="567" y2="368" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ArgoCD App (Kokumi-created) ── -->
  <rect x="700" y="250" width="175" height="90" rx="8" fill="#e0f7fa" stroke="#00bcd4" stroke-width="1.5"/>
  <text x="787" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#006064">ArgoCD App</text>
  <text x="787" y="292" text-anchor="middle" font-size="11" fill="#444">(created by Kokumi)</text>
  <text x="787" y="310" text-anchor="middle" font-size="11" fill="#444">Points to OCI digest</text>
  <text x="787" y="328" text-anchor="middle" font-size="11" fill="#444">sha256:...</text>

  <!-- Kokumi → ArgoCD App -->
  <line x1="655" y1="222" x2="740" y2="260" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Registry → ArgoCD App -->
  <line x1="655" y1="393" x2="700" y2="330" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- ── Pods ── -->
  <rect x="700" y="400" width="175" height="90" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="787" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Workloads</text>
  <text x="787" y="444" text-anchor="middle" font-size="11" fill="#444">Deployment + Service</text>
  <text x="787" y="462" text-anchor="middle" font-size="11" fill="#444">ns: microservices-dev</text>
  <text x="787" y="480" text-anchor="middle" font-size="11" fill="#444">ns: microservices-qa</text>

  <!-- ArgoCD App → Pods -->
  <line x1="787" y1="340" x2="787" y2="398" stroke="#00bcd4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="20" y="490" width="860" height="72" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="36" y="510" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <line x1="36" y1="530" x2="76" y2="530" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="82" y="534" font-size="11" fill="#555">Deploys / creates</text>
  <line x1="200" y1="530" x2="240" y2="530" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="246" y="534" font-size="11" fill="#555">Pulls from</text>
  <text x="36" y="552" font-size="11" fill="#555">Each env (dev/qa) has its own: Order → Preparation → Serving → ArgoCD App → Namespace</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
